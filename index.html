<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRAWO — Aprende a dibujar</title>
<style>
:root {
  --bg:#f5f6fa; --card:#fff; --ink:#242638; --muted:#777b8e;
  --primary:#7057df; --primary2:#5941c4; --green:#38b889;
  --line:#e8e8f0; --yellow:#ffd76a; --red:#e76b75;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer;border:0}
.topbar{height:68px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:5}
.logo{font-size:25px;font-weight:950;letter-spacing:1px;color:var(--primary)}
.stats{display:flex;gap:17px;font-weight:750;font-size:14px}
.stat{white-space:nowrap}
main{max-width:1050px;margin:auto;padding:25px 20px 100px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:18px;box-shadow:0 4px 16px #2221}
h1,h2,h3,p{margin-top:0}
h1{font-size:30px;margin-bottom:8px}
h2{font-size:23px}
h3{font-size:18px}
p{line-height:1.55}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{padding:12px 18px;border-radius:12px;background:var(--primary);color:white;font-weight:800;transition:.15s}
.btn:hover{background:var(--primary2);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.secondary{background:#efedfc;color:var(--primary)}
.btn.ghost{background:#f0f1f6;color:var(--ink)}
.btn.danger{background:#fff0f0;color:#bd3f4b}
.btn.green{background:var(--green)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.hidden{display:none!important}
.hero{padding:32px;background:linear-gradient(135deg,#eeeaff,#fff);border-radius:22px;display:flex;gap:22px;align-items:center;margin-bottom:20px}
.mascot{width:90px;height:90px;flex-shrink:0;border-radius:24px;background:#e2dcff;display:grid;place-items:center;font-size:53px}
.dialogue{background:white;border:1px solid var(--line);border-radius:15px;padding:14px 16px;margin:12px 0}
.dialogue b{color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.stage-card,.lesson-card{border:1px solid var(--line);border-radius:17px;padding:17px;background:white}
.stage-card.locked{opacity:.55}
.lesson-card{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lesson-card button{flex-shrink:0}
.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#efedfc;color:var(--primary);font-size:12px;font-weight:800}
.progress{height:10px;background:#ececf3;border-radius:20px;overflow:hidden;margin:12px 0}
.progress>div{height:100%;background:var(--green);width:0;transition:width .2s}
.activity-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.activity-number{color:var(--primary);font-weight:850}

.canvas-wrap{
 background:#fff;border:2px solid var(--line);border-radius:16px;
 overflow:hidden;touch-action:none;position:relative;
}
canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;touch-action:none;cursor:crosshair}
#demoCanvas{
 position:absolute;inset:0;width:100%;height:100%;
 pointer-events:none;z-index:2;aspect-ratio:4/3;
}
.trazo-demo{
 position:absolute;z-index:3;pointer-events:none;
 font-size:34px;line-height:1;
 transform:translate(-25%,-85%);
 filter:drop-shadow(0 2px 2px #0003);
 will-change:left,top;
}
.trazo-demo.idle{animation:trazoIdle .8s ease-in-out infinite alternate}
@keyframes trazoIdle{
 from{margin-top:-2px;transform:translate(-25%,-85%) rotate(-5deg)}
 to{margin-top:3px;transform:translate(-25%,-85%) rotate(5deg)}
}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.tool{background:#f1f1f7;padding:9px 11px;border-radius:10px;display:flex;align-items:center;gap:7px;font-size:13px}
.tool input[type=range]{width:90px}
.tool input[type=color]{width:32px;height:27px;border:0;padding:0;background:none}
.check-result{padding:13px 15px;border-radius:13px;margin-top:13px;background:#f2f0ff}
.check-result.good{background:#e8f8f1}
.check-result.bad{background:#fff1ef}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:9px;z-index:8}
.bottomnav button{background:transparent;color:var(--muted);padding:9px 17px;border-radius:12px;font-weight:750}
.bottomnav button.active{background:#efedfc;color:var(--primary)}
input[type=text]{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;outline-color:var(--primary)}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.notice{background:#fff8e5;padding:13px 15px;border-radius:12px;color:#765c19;font-size:13px;line-height:1.5}
.setting-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px 0;border-bottom:1px solid var(--line)}
.setting-row:last-child{border:0}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">DRAWO</div>
  <div class="stats">
    <div class="stat">⭐ <span id="xp">0</span> XP</div>
    <div class="stat">🔥 <span id="streak">0</span></div>
  </div>
</header>
<main id="app"></main>
<nav class="bottomnav hidden" id="nav">
  <button data-page="home" class="active">⌂ Inicio</button>
  <button data-page="route">▤ Recorrido</button>
  <button data-page="profile">◉ Perfil</button>
  <button data-page="settings">⚙ Ajustes</button>
</nav>
<input type="file" id="imageUpload" accept="image/*" class="hidden">

function loadData(){
 try {
  const d = JSON.parse(localStorage.getItem(KEY));
  if(d && d.version === 3) return d;
 } catch(e){}
 return {
  version:3, profile:null, xp:0, streak:0, lastDay:"",
  completed:[], lessonProgress:{}, accountExists:false
 };
}
function save(){
 localStorage.setItem(KEY,JSON.stringify(data));
 updateStats();
}
function updateStats(){
 document.getElementById("xp").textContent=data.xp;
 document.getElementById("streak").textContent=data.streak;
}
function today(){return new Date().toISOString().slice(0,10)}
function updateStreak(){
 const t=today();
 if(data.lastDay!==t){
  const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
  data.streak=data.lastDay===y?data.streak+1:1;
  data.lastDay=t;
 }
}
function mascot(name,face){
 return `<div class="mascot">${face||"✏️"}</div>`;
}
function showWelcome(){
 nav.classList.add("hidden");
 app.innerHTML=`
 <section class="hero">
  ${mascot("Trazo","✏️")}
  <div><h1>¡Bienvenido a DRAWO!</h1>
  <p>Aprende a dibujar. Un trazo a la vez.</p>
  <div class="dialogue"><b>Trazo:</b> ¡Hola! Yo te voy a acompañar mientras aprendes a dibujar. Primero, dime cómo te llamas.</div>
  </div>
 </section>
 <section class="panel">
  <h2>Tu perfil</h2>
  <p class="muted">Esta beta guarda tu perfil y progreso en este navegador.</p>
  <label for="profileName">¿Cómo quieres que te llamemos?</label>
  <input id="profileName" type="text" maxlength="20" placeholder="Escribe tu nombre">
  <div class="btnrow"><button class="btn" id="createProfile">Comenzar</button></div>
  ${data.profile?`<hr><p>Ya existe un perfil local: <b>${escapeHTML(data.profile)}</b></p><button class="btn secondary" id="continueProfile">Continuar con este perfil</button>`:""}
 </section>`;
 document.getElementById("createProfile").onclick=()=>{
  const n=document.getElementById("profileName").value.trim();
  if(!n){alert("Escribe un nombre para continuar.");return}
  data.profile=n;data.accountExists=true;updateStreak();save();showPage("home");
 };
 const cont=document.getElementById("continueProfile");
 if(cont)cont.onclick=()=>{updateStreak();save();showPage("home")};
}
function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function showPage(p){
 stopDemo();
 page=p;
 nav.classList.remove("hidden");
 nav.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));
 if(p==="home")renderHome();
 if(p==="route")renderRoute();
 if(p==="profile")renderProfile();
 if(p==="settings")renderSettings();
}
function renderHome(){
 const done=data.completed.length;
 app.innerHTML=`
 <section class="hero">
  ${mascot("Trazo","✏️")}
  <div><h1>¡Hola, ${escapeHTML(data.profile)}!</h1>
  <p>¿Listo para seguir dibujando? Trazo tiene una nueva actividad para ti.</p>
  <span class="tag">Etapa 1 · Primeros trazos</span></div>
 </section>
 <section class="panel">
  <h2>Tu recorrido</h2>
  <p class="muted">Tu primera etapa tiene siete lecciones y cada una contiene cinco actividades.</p>
  <div class="progress"><div style="width:${done/7*100}%"></div></div>
  <p><b>${done} de 7</b> lecciones completadas</p>

/* LIENZO Y DETECCIÓN INMEDIATA DE TRAMO */
function initCanvas(){
 canvas=document.getElementById("drawingCanvas");
 ctx=canvas.getContext("2d");
 demoCanvas=document.getElementById("demoCanvas");
 demoCtx=demoCanvas.getContext("2d");
 redraw();
 clearDemoCanvas();

 const getPos=e=>{
  const r=canvas.getBoundingClientRect();
  return {
   x:(e.clientX-r.left)/r.width*canvas.width,
   y:(e.clientY-r.top)/r.height*canvas.height
  };
 };

 canvas.onpointerdown=e=>{
  // Detiene y borra la animación inmediatamente al primer toque o clic del alumno
  stopDemo();
  drawing=true;
  canvas.setPointerCapture(e.pointerId);
  const p=getPos(e);
  currentStroke={
   points:[p],
   color:document.getElementById("color").value,
   size:Number(document.getElementById("size").value),
   opacity:Number(document.getElementById("opacity").value)/100
  };
  redoStack=[];
  strokes.push(currentStroke);
  redraw();
 };
 canvas.onpointermove=e=>{
  if(!drawing||!currentStroke)return;
  currentStroke.points.push(getPos(e));
  redraw();
 };
 const end=()=>{drawing=false;currentStroke=null};
 canvas.onpointerup=end;
 canvas.onpointercancel=end;

 document.getElementById("size").oninput=e=>{ document.getElementById("sizeValue").textContent=e.target.value; };
 document.getElementById("opacity").oninput=e=>{ document.getElementById("opacityValue").textContent=e.target.value+"%"; };
}

function redraw(){
 if(!canvas||!ctx)return;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle="#ffffff";
 ctx.fillRect(0,0,canvas.width,canvas.height);
 if(uploadedImage){
  try{ctx.drawImage(uploadedImage,0,0,canvas.width,canvas.height)}catch(e){}
 }
 for(const s of strokes)drawStroke(s);
}
function drawStroke(s){
 if(!s.points||!s.points.length)return;
 ctx.save();
 ctx.globalAlpha=s.opacity??1;
 ctx.strokeStyle=s.color||"#222";
 ctx.fillStyle=s.color||"#222";
 ctx.lineWidth=s.size||5;
 ctx.lineCap="round";
 ctx.lineJoin="round";
 if(s.points.length===1){
  ctx.beginPath();
  ctx.arc(s.points[0].x,s.points[0].y,(s.size||5)/2,0,Math.PI*2);
  ctx.fill();
 }else{
  ctx.beginPath();
  ctx.moveTo(s.points[0].x,s.points[0].y);
  for(let i=1;i<s.points.length;i++)ctx.lineTo(s.points[i].x,s.points[i].y);
  ctx.stroke();
 }
 ctx.restore();
}

document.getElementById("imageUpload").addEventListener("change",e=>{
 const file=e.target.files[0];
 if(!file)return;
 if(!file.type.startsWith("image/")){alert("Selecciona un archivo de imagen.");return;}
 const reader=new FileReader();
 reader.onload=()=>{
  const img=new Image();
  img.onload=()=>{ uploadedImage=img; redraw(); alert("Dibujo cargado en el lienzo."); };
  img.src=reader.result;
 };
 reader.readAsDataURL(file);
 e.target.value="";
});

/* MOTOR DE DEMOSTRACIÓN EN BUCLE AUTOMÁTICO */
function clearDemoCanvas(){
 if(!demoCanvas||!demoCtx)return;
 demoCtx.clearRect(0,0,demoCanvas.width,demoCanvas.height);
}
function hideTrazo(){
 const el=document.getElementById("trazoDemo");
 if(el){ el.classList.add("hidden"); el.classList.remove("idle"); }
}
function moveTrazo(x,y,idle=false){
 const el=document.getElementById("trazoDemo");
 if(!el||!demoCanvas)return;
 const wrap=demoCanvas.parentElement.getBoundingClientRect();
 const rect=demoCanvas.getBoundingClientRect();
 if(!rect.width||!rect.height)return;

 el.classList.remove("hidden");
 el.classList.toggle("idle",idle);
 el.style.left=((rect.left-wrap.left)+(x/demoCanvas.width)*rect.width)+"px";
 el.style.top=((rect.top-wrap.top)+(y/demoCanvas.height)*rect.height)+"px";
}
function stopDemo(){
 if(demoFrame!==null){ cancelAnimationFrame(demoFrame); demoFrame=null; }
 if(demoLoopTimer!==null){ clearTimeout(demoLoopTimer); demoLoopTimer=null; }
 demoPlaying=false;
 clearDemoCanvas();
 hideTrazo();
}

function getPointAt(path,t){
 if(path.length===1)return {x:path[0][0],y:path[0][1]};
 const lengths=[];
 let total=0;
 for(let i=1;i<path.length;i++){
  const len=Math.hypot(path[i][0]-path[i-1][0],path[i][1]-path[i-1][1]);
  lengths.push(len);
  total+=len;
 }
 let target=total*Math.max(0,Math.min(1,t));
 for(let i=0;i<lengths.length;i++){
  if(target<=lengths[i]||i===lengths.length-1){
   const part=lengths[i]===0?1:target/lengths[i];
   return {
    x:path[i][0]+(path[i+1][0]-path[i][0])*part,
    y:path[i][1]+(path[i+1][1]-path[i][1])*part
   };
  }
  target-=lengths[i];
 }
 return {x:path[path.length-1][0],y:path[path.length-1][1]};
}
function getPartialPath(path,t){
 const points=[path[0]];
 if(t<=0)return points;
 const lengths=[];
 let total=0;
 for(let i=1;i<path.length;i++){
  const len=Math.hypot(path[i][0]-path[i-1][0],path[i][1]-path[i-1][1]);
  lengths.push(len);
  total+=len;
 }
 let remaining=total*t;
 for(let i=0;i<lengths.length;i++){
  const a=path[i],b=path[i+1],len=lengths[i];
  if(remaining>=len){
   points.push(b);
   remaining-=len;
  }else{
   const q=len===0?1:remaining/len;
   points.push([a[0]+(b[0]-a[0])*q,a[1]+(b[1]-a[1])*q]);
   break;
  }
 }
 return points;
}
function drawDemoPath(path,t=1){
 const points=getPartialPath(path,t);
 if(!points.length)return;
 demoCtx.beginPath();
 demoCtx.moveTo(points[0][0]*demoCanvas.width,points[0][1]*demoCanvas.height);
 for(let i=1;i<points.length;i++){
  demoCtx.lineTo(points[i][0]*demoCanvas.width,points[i][1]*demoCanvas.height);
 }
 demoCtx.stroke();
}
function renderDemo(completed,currentPath,currentT){
 clearDemoCanvas();
 demoCtx.save();
 demoCtx.strokeStyle="#7057df";
 demoCtx.lineWidth=7;
 demoCtx.lineCap="round";
 demoCtx.lineJoin="round";
 for(const p of completed)drawDemoPath(p,1);
 if(currentPath)drawDemoPath(currentPath,currentT);
 demoCtx.restore();
}
function playDemo(){
 stopDemo();

 const type=activities[currentLesson][currentActivity][3];
 const demo=demos[type];
 const feedback=document.getElementById("feedback");

 if(!demo||!demo.paths||!demo.paths.length){
  if(feedback)feedback.innerHTML='<div class="check-result">Sin demostración disponible.</div>';
  return;
 }

 clearDemoCanvas();
 hideTrazo();
 demoPlaying=true;

 let index=0;
 let phase="drawing";
 let phaseStart=performance.now();
 let pauseStart=0;
 const completed=[];
 let currentT=0;
 const duration=650;
 const pauseDuration=420;
 const loopRestartDelay=1100;
 let currentPath=demo.paths[0];

 function scheduleLoopRestart(){
  if(!demoPlaying)return;
  demoFrame=null;
  demoLoopTimer=setTimeout(()=>{
   if(!demoPlaying)return;
   demoLoopTimer=null;
   completed.length=0;
   index=0;
   currentPath=demo.paths[0];
   phase="drawing";
   phaseStart=performance.now();
   currentT=0;
   clearDemoCanvas();
   demoFrame=requestAnimationFrame(frame);
  },loopRestartDelay);
 }

 function frame(now){
  if(!demoPlaying)return;

  if(phase==="drawing"){
   currentT=Math.min(1,(now-phaseStart)/duration);
   renderDemo(completed,currentPath,currentT);

   const point=getPointAt(currentPath,currentT);
   moveTrazo(point.x*demoCanvas.width,point.y*demoCanvas.height);

   if(currentT>=1){
    completed.push(currentPath);
    phase="pause";
    pauseStart=now;
   }
  }else if(phase==="pause"){
   renderDemo(completed,null,0);
   const last=currentPath[currentPath.length-1];
   moveTrazo(last[0]*demoCanvas.width,last[1]*demoCanvas.height);

   if(now-pauseStart>=pauseDuration){
    if(demo.separate)completed.length=0;
    index++;
    if(index>=demo.paths.length){
     scheduleLoopRestart();
     return;
    }
    currentPath=demo.paths[index];
    phase="drawing";
    phaseStart=now;
    currentT=0;
   }
  }

  demoFrame=requestAnimationFrame(frame);
 }
 demoFrame=requestAnimationFrame(frame);
}

/* COMPROBACIÓN */
function getMetrics(){
 const all=strokes.filter(s=>s.points&&s.points.length);
 const lineStats=all.map(s=>{
  const p=s.points;
  const first=p[0],last=p[p.length-1];
  const dx=last.x-first.x,dy=last.y-first.y;
  const length=Math.hypot(dx,dy);
  let path=0;
  for(let i=1;i<p.length;i++)path+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);
  return {dx,dy,length,path,ratio:(length?path/length:1),points:p.length,opacity:s.opacity??1};
 });
 const total=all.length;
 const horizontal=lineStats.filter(s=>Math.abs(s.dy)<Math.abs(s.dx)*.35).length;
 const vertical=lineStats.filter(s=>Math.abs(s.dx)<Math.abs(s.dy)*.35).length;
 const diagonal=lineStats.filter(s=>Math.abs(s.dx)>20&&Math.abs(s.dy)>20&&Math.abs(Math.abs(s.dx)-Math.abs(s.dy))<Math.max(Math.abs(s.dx),Math.abs(s.dy))*.8).length;
 const curved=lineStats.filter(s=>s.ratio>1.18&&s.points>5).length;
 const opacities=lineStats.map(s=>s.opacity);
 return {total,horizontal,vertical,diagonal,curved,opacities,lineStats};
}

function checkActivity(){
 stopDemo();
 const type=activities[currentLesson][currentActivity][3];
 const m=getMetrics();
 let pass=false,msg="";
 const requireStrokes=n=>m.total>=n;

 switch(type){
  case "five": case "fiveCurves": pass=requireStrokes(5); msg="Intenta realizar al menos cinco trazos."; break;
  case "shapes": pass=requireStrokes(3); msg="Prueba a dibujar varias formas diferentes."; break;
  case "variety": case "allDirections": pass=m.total>=3; msg="Combina distintos tipos de trazos y direcciones."; break;
  case "horizontal": pass=m.horizontal>=2; msg="Dibuja al menos tres líneas horizontales."; break;
  case "parallel": pass=m.total>=6; msg="Dibuja varias líneas paralelas o diagonales."; break;
  case "house": pass=m.total>=6; msg="Construye la casa con varios trazos."; break;
  case "curveTypes": case "ocean": case "curveVariety": pass=m.curved>=3; msg="Incluye líneas curvas u ondas."; break;
  case "intensity": case "fiveLevels": pass=m.total>=3; msg="Varía la opacidad de tus trazos."; break;
  case "sphere": case "shading": pass=m.total>=5; msg="Dibuja el objeto con varios trazos y tonos."; break;
  case "circles": pass=m.total>=3; msg="Intenta dibujar tres círculos."; break;
  case "path": case "route": pass=m.total>=1; msg="Realiza un trazo continuo."; break;
  case "threeCombined": case "objects": case "rocket": pass=m.total>=5; msg="Combina más trazos para tus formas."; break;
  default: pass=m.total>=2; msg="Prueba a añadir algunos trazos más.";
 }

 const feedback=document.getElementById("feedback");
 if(pass){
  feedback.innerHTML=`<div class="check-result good"><b>¡Muy bien!</b><br>Has cumplido el objetivo.</div><div class="btnrow"><button class="btn green" id="nextActivity">Continuar →</button></div>`;
  document.getElementById("nextActivity").onclick=nextActivity;
 }else{
  feedback.innerHTML=`<div class="check-result bad"><b>¡Casi lo tienes!</b><br>${msg}</div>`;
 }
}

function nextActivity(){

  currentActivity++;

  renderActivityExplanation();

  if(!data.completed.includes(currentLesson)){
   data.completed.push(currentLesson);
   data.xp+=50;
   updateStreak();

  }
  renderLessonComplete();
 }
}
