<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRAWO — Aprende a dibujar</title>
<style>
:root {
  --bg:#f5f6fa; --card:#fff; --ink:#242638; --muted:#777b8e;
  --primary:#7057df; --primary2:#5941c4; --green:#38b889;
  --line:#e8e8f0; --yellow:#ffd76a; --red:#e76b75;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer;border:0}
.topbar{height:68px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:5}
.logo{font-size:25px;font-weight:950;letter-spacing:1px;color:var(--primary)}
.stats{display:flex;gap:17px;font-weight:750;font-size:14px}
.stat{white-space:nowrap}
main{max-width:1050px;margin:auto;padding:25px 20px 100px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:18px;box-shadow:0 4px 16px #2221}
h1,h2,h3,p{margin-top:0}
h1{font-size:30px;margin-bottom:8px}
h2{font-size:23px}
h3{font-size:18px}
p{line-height:1.55}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{padding:12px 18px;border-radius:12px;background:var(--primary);color:white;font-weight:800;transition:.15s}
.btn:hover{background:var(--primary2);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.secondary{background:#efedfc;color:var(--primary)}
.btn.ghost{background:#f0f1f6;color:var(--ink)}
.btn.danger{background:#fff0f0;color:#bd3f4b}
.btn.green{background:var(--green)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.hidden{display:none!important}
.hero{padding:32px;background:linear-gradient(135deg,#eeeaff,#fff);border-radius:22px;display:flex;gap:22px;align-items:center;margin-bottom:20px}
.mascot{width:90px;height:90px;flex-shrink:0;border-radius:24px;background:#e2dcff;display:grid;place-items:center;font-size:53px}
.mascot.smallmascot{width:55px;height:55px;font-size:33px;border-radius:16px}
.dialogue{background:white;border:1px solid var(--line);border-radius:15px;padding:14px 16px;margin:12px 0}
.dialogue b{color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.stage-card,.lesson-card{border:1px solid var(--line);border-radius:17px;padding:17px;background:white}
.stage-card.locked{opacity:.55}
.lesson-card{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lesson-card button{flex-shrink:0}
.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#efedfc;color:var(--primary);font-size:12px;font-weight:800}
.progress{height:10px;background:#ececf3;border-radius:20px;overflow:hidden;margin:12px 0}
.progress>div{height:100%;background:var(--green);width:0;transition:width .2s}
.activity-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.activity-number{color:var(--primary);font-weight:850}
.canvas-wrap{background:#fff;border:2px solid var(--line);border-radius:16px;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;touch-action:none;cursor:crosshair}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.tool{background:#f1f1f7;padding:9px 11px;border-radius:10px;display:flex;align-items:center;gap:7px;font-size:13px}
.tool input[type=range]{width:90px}
.tool input[type=color]{width:32px;height:27px;border:0;padding:0;background:none}
.check-result{padding:13px 15px;border-radius:13px;margin-top:13px;background:#f2f0ff}
.check-result.good{background:#e8f8f1}
.check-result.bad{background:#fff1ef}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:9px;z-index:8}
.bottomnav button{background:transparent;color:var(--muted);padding:9px 17px;border-radius:12px;font-weight:750}
.bottomnav button.active{background:#efedfc;color:var(--primary)}
input[type=text]{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;outline-color:var(--primary)}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.notice{background:#fff8e5;padding:13px 15px;border-radius:12px;color:#765c19;font-size:13px;line-height:1.5}
.setting-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px 0;border-bottom:1px solid var(--line)}
.setting-row:last-child{border:0}
@media(max-width:600px){
 .topbar{padding:0 15px}.stats{gap:9px;font-size:12px}
 main{padding:17px 12px 100px}.panel{padding:17px}
 .hero{padding:19px;gap:12px}.mascot{width:65px;height:65px;font-size:40px}
 h1{font-size:25px}.bottomnav{justify-content:space-around}
 .bottomnav button{padding:9px 10px;font-size:12px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">DRAWO</div>
  <div class="stats">
    <div class="stat">⭐ <span id="xp">0</span> XP</div>
    <div class="stat">🔥 <span id="streak">0</span></div>
  </div>
</header>

<main id="app"></main>

<nav class="bottomnav hidden" id="nav">
  <button data-page="home" class="active">⌂ Inicio</button>
  <button data-page="route">▤ Recorrido</button>
  <button data-page="profile">◉ Perfil</button>
  <button data-page="settings">⚙ Ajustes</button>
</nav>

<input type="file" id="imageUpload" accept="image/*" class="hidden">

<script>
(() => {
"use strict";

const KEY = "drawo_beta3_local";
const app = document.getElementById("app");
const nav = document.getElementById("nav");

const lessonNames = [
 "Conociendo el dibujo",
 "Las líneas rectas",
 "Las líneas curvas",
 "La presión del lápiz",
 "Precisión y coordinación",
 "Combinando trazos",
 "Mi primer gran dibujo"
];

const activities = [
 [
  ["Aprende","Conociendo el dibujo","Un dibujo puede construirse con líneas, formas y colores. Observa cómo se combinan para crear algo nuevo.","lines"],
  ["Practica","Tus primeros trazos","Dibuja al menos cinco trazos libres. No necesitas hacer una figura perfecta.","five"],
  ["Experimenta","Formas básicas","Prueba a dibujar círculos, cuadrados y triángulos. ¡Son piezas fundamentales del dibujo!","shapes"],
  ["Crea","Una pequeña composición","Combina líneas y formas para inventar un dibujo sencillo. No hay una única respuesta correcta.","creative"],
  ["Finaliza","Combinando elementos","Haz una composición que incluya líneas rectas, curvas y formas geométricas.","variety"]
 ],
 [
  ["Aprende","Las líneas rectas","Las líneas rectas pueden ser horizontales, verticales o diagonales. Observa los ejemplos.","directions"],
  ["Practica","Líneas horizontales","Dibuja tres líneas que vayan de izquierda a derecha.","horizontal"],
  ["Experimenta","Paralelas y diagonales","Dibuja cuatro líneas paralelas y luego cuatro líneas diagonales.","parallel"],
  ["Crea","Construye una casa","Usa líneas rectas para crear una casa con paredes, techo, puerta y ventanas.","house"],
  ["Finaliza","Tres direcciones","Crea una composición que incluya líneas horizontales, verticales y diagonales.","allDirections"]
 ],
 [
  ["Aprende","Las líneas curvas","A diferencia de las rectas, las curvas cambian de dirección suavemente. Pueden formar ondas, arcos y espirales.","curves"],
  ["Practica","Dibuja curvas","Dibuja al menos cinco líneas curvas.","fiveCurves"],
  ["Experimenta","Ondas, arcos y espirales","Prueba dos ondas, dos arcos y dos espirales.","curveTypes"],
  ["Crea","Un océano de líneas","Imagina un océano y represéntalo con ondas, curvas y algunos detalles.","ocean"],
  ["Finaliza","Composición de curvas","Haz un dibujo que combine al menos tres tipos de líneas curvas.","curveVariety"]
 ],
 [
  ["Aprende","La intensidad del trazo","Puedes conseguir trazos suaves o fuertes cambiando la opacidad y el tamaño del pincel.","opacity"],
  ["Practica","Tres intensidades","Dibuja tres líneas: una suave, una intermedia y una intensa. Cambia la opacidad entre ellas.","intensity"],
  ["Experimenta","Escala de intensidad","Intenta crear cinco niveles diferentes de intensidad en tus trazos.","fiveLevels"],
  ["Crea","Una esfera con volumen","Dibuja una esfera e intenta sugerir luz y sombra usando distintas intensidades.","sphere"],
  ["Finaliza","Un objeto con luces y sombras","Dibuja un objeto sencillo y utiliza diferentes intensidades para darle volumen.","shading"]
 ],
 [
  ["Aprende","Precisión y coordinación","Seguir puntos y caminos ayuda a controlar mejor el movimiento de tu mano.","points"],
  ["Practica","Conecta los puntos","Dibuja una línea que pase cerca de varios puntos imaginarios.","path"],
  ["Experimenta","Círculos controlados","Intenta dibujar tres círculos de tamaño parecido.","circles"],
  ["Crea","Construye una figura","Usa puntos y líneas guía para construir una figura sencilla.","guided"],
  ["Finaliza","Un recorrido de trazos","Crea un dibujo que combine líneas rectas, curvas y cambios de dirección.","route"]
 ],
 [
  ["Aprende","Combinando trazos","Las figuras más interesantes pueden construirse combinando líneas rectas y curvas.","combine"],
  ["Practica","Tres formas combinadas","Crea tres formas distintas usando líneas rectas y curvas.","threeCombined"],
  ["Experimenta","Inventa objetos","Combina círculos, líneas rectas y curvas para inventar tres objetos.","objects"],
  ["Crea","Un cohete","Construye un cohete usando formas geométricas y distintos tipos de líneas.","rocket"],
  ["Finaliza","Tu propia creación","Haz un dibujo libre que combine varios tipos de trazos y formas.","freeCombined"]
 ],
 [
  ["Aprende","Todo lo que aprendiste","Repasemos: líneas rectas, curvas, formas, control del trazo e intensidad.","review"],
  ["Practica","Calentamiento","Dibuja una línea recta, una curva, un círculo y una figura formada por varios trazos.","warmup"],
  ["Experimenta","Tu espacio de pruebas","Prueba diferentes tamaños, colores y combinaciones de trazos.","freeTest"],
  ["Crea","Una obra propia","Elige un tema y prepara tu dibujo. Puede ser un paisaje, un personaje, un animal o cualquier idea tuya.","finalCreate"],
  ["Finaliza","Mi primer gran dibujo","¡Llegó el momento! Crea una obra que reúna lo aprendido en esta etapa.","finalWork"]
 ]
];

const demos = {
 lines:[["line",.18,.28,.78,.28],["line",.18,.50,.78,.50],["line",.18,.72,.78,.72]],
 directions:[["line",.2,.3,.8,.3],["line",.5,.15,.5,.85],["line",.2,.8,.8,.2]],
 horizontal:[["line",.15,.3,.85,.3],["line",.15,.5,.85,.5],["line",.15,.7,.85,.7]],
 curves:[["curve",.15,.5,.35,.15,.65,.85,.85,.5],["line",.15,.8,.85,.8]],
 opacity:[["line",.15,.3,.85,.3],["line",.15,.5,.85,.5],["line",.15,.7,.85,.7]],
 points:[["line",.2,.3,.5,.2],["line",.5,.2,.75,.55]],
 combine:[["line",.2,.7,.5,.2],["line",.5,.2,.8,.7],["curve",.8,.7,.65,.85,.35,.85,.2,.7]]
};

let data = loadData();
let page = "home";
let currentLesson = 0;
let currentActivity = 0;
let drawing = false;
let strokes = [];
let redoStack = [];
let currentStroke = null;
let canvas = null;
let ctx = null;
let uploadedImage = null;
let demoTimer = null;
let demoPlaying = false;
let lastCheck = null;

function loadData(){
 try {
  const d = JSON.parse(localStorage.getItem(KEY));
  if(d && d.version === 3) return d;
 } catch(e){}
 return {
  version:3, profile:null, xp:0, streak:0, lastDay:"",
  completed:[], lessonProgress:{}, accountExists:false
 };
}
function save(){
 localStorage.setItem(KEY,JSON.stringify(data));
 updateStats();
}
function updateStats(){
 document.getElementById("xp").textContent=data.xp;
 document.getElementById("streak").textContent=data.streak;
}
function today(){return new Date().toISOString().slice(0,10)}
function updateStreak(){
 const t=today();
 if(data.lastDay!==t){
  const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
  data.streak=data.lastDay===y?data.streak+1:1;
  data.lastDay=t;
 }
}
function mascot(name,face){
 return `<div class="mascot">${face||"✏️"}</div>`;
}
function showWelcome(){
 nav.classList.add("hidden");
 app.innerHTML=`
 <section class="hero">
  ${mascot("Trazo","✏️")}
  <div><h1>¡Bienvenido a DRAWO!</h1>
  <p>Aprende a dibujar. Un trazo a la vez.</p>
  <div class="dialogue"><b>Trazo:</b> ¡Hola! Yo te voy a acompañar mientras aprendes a dibujar. Primero, dime cómo te llamas.</div>
  </div>
 </section>
 <section class="panel">
  <h2>Tu perfil</h2>
  <p class="muted">Esta beta guarda tu perfil y progreso en este navegador. No necesitas correo ni contraseña.</p>
  <label for="profileName">¿Cómo quieres que te llamemos?</label>
  <input id="profileName" type="text" maxlength="20" placeholder="Escribe tu nombre">
  <div class="btnrow"><button class="btn" id="createProfile">Comenzar</button></div>
  <div class="notice" style="margin-top:15px">Si ya habías creado un perfil en este navegador, puedes continuar con él. Esta beta no tiene cuentas en la nube.</div>
  ${data.profile?`<hr><p>Ya existe un perfil local: <b>${escapeHTML(data.profile)}</b></p><button class="btn secondary" id="continueProfile">Continuar con este perfil</button>`:""}
 </section>`;
 document.getElementById("createProfile").onclick=()=>{
  const n=document.getElementById("profileName").value.trim();
  if(!n){alert("Escribe un nombre para continuar.");return}
  data.profile=n;data.accountExists=true;updateStreak();save();showPage("home");
 };
 const cont=document.getElementById("continueProfile");
 if(cont)cont.onclick=()=>{updateStreak();save();showPage("home")};
}
function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function showPage(p){
 stopDemo();
 page=p;
 nav.classList.remove("hidden");
 nav.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));
 if(p==="home")renderHome();
 if(p==="route")renderRoute();
 if(p==="profile")renderProfile();
 if(p==="settings")renderSettings();
}
function renderHome(){
 const done=data.completed.length;
 app.innerHTML=`
 <section class="hero">
  ${mascot("Trazo","✏️")}
  <div><h1>¡Hola, ${escapeHTML(data.profile)}!</h1>
  <p>¿Listo para seguir dibujando? Trazo tiene una nueva actividad para ti.</p>
  <span class="tag">Etapa 1 · Primeros trazos</span></div>
 </section>
 <section class="panel">
  <h2>Tu recorrido</h2>
  <p class="muted">Tu primera etapa tiene siete lecciones y cada una contiene cinco actividades.</p>
  <div class="progress"><div style="width:${done/7*100}%"></div></div>
  <p><b>${done} de 7</b> lecciones completadas</p>
  <button class="btn" id="continueLesson">${done===7?"Repasar recorrido":"Continuar aprendiendo"}</button>
 </section>
 <section class="panel">
  <h2>Conoce a tus compañeros</h2>
  <div class="grid">
   <div class="stage-card"><div style="font-size:35px">✏️</div><h3>Trazo</h3><p class="muted">Tu guía. Paciente y dedicado, te enseñará paso a paso.</p></div>
   <div class="stage-card"><div style="font-size:35px">🧽</div><h3>Gomi</h3><p class="muted">Competitivo y bromista. Siempre tiene algo que comentar.</p></div>
   <div class="stage-card"><div style="font-size:35px">🖌️</div><h3>Brushi</h3><p class="muted">Creativa y entusiasta. Le encanta experimentar.</p></div>
  </div>
 </section>`;
 document.getElementById("continueLesson").onclick=()=>{
  const i=firstIncomplete();
  if(i<0){renderRoute();return}
  startLesson(i);
 };
}
function firstIncomplete(){
 for(let i=0;i<7;i++)if(!data.completed.includes(i))return i;
 return -1;
}
function renderRoute(){
 const done=data.completed.length;
 app.innerHTML=`
 <section class="panel">
  <h1>Tu recorrido</h1>
  <p class="muted">Etapa 1 de 10 · Primeros trazos</p>
  <div class="progress"><div style="width:${done/7*100}%"></div></div>
  <p><b>${done}/7</b> lecciones completadas</p>
  <div class="grid" id="lessonList"></div>
 </section>
 <section class="panel">
  <h2>Las próximas etapas</h2>
  <p class="muted">Estas etapas estarán disponibles en futuras versiones de DRAWO.</p>
  <div class="grid">
   ${["Figuras geométricas","Formas y volumen","Luces y sombras","Perspectiva","Anatomía básica","Rostros y expresiones","Composición","Objetos y escenarios","Creación de personajes"].map((n,i)=>`<div class="stage-card locked"><span class="tag">Etapa ${i+2}</span><h3>${n}</h3><p class="muted small">Próximamente</p></div>`).join("")}
  </div>
 </section>`;
 const list=document.getElementById("lessonList");
 lessonNames.forEach((name,i)=>{
  const complete=data.completed.includes(i);
  const unlocked=i===0||data.completed.includes(i-1);
  const card=document.createElement("div");
  card.className="lesson-card";
  card.innerHTML=`<div><span class="tag">${complete?"Completada":unlocked?"Disponible":"Bloqueada"}</span><h3 style="margin:9px 0 3px">${i+1}. ${name}</h3><p class="muted small">${complete?"¡Buen trabajo!":unlocked?"5 actividades":"Completa la lección anterior"}</p></div><button class="btn ${complete?"secondary":""}" ${unlocked?"":"disabled"}>${complete?"Repasar": "Entrar"}</button>`;
  card.querySelector("button").onclick=()=>startLesson(i);
  list.appendChild(card);
 });
}
function renderProfile(){
 const done=data.completed.length;
 app.innerHTML=`
 <section class="panel">
  <h1>Mi perfil</h1>
  <div class="hero" style="margin:0">
   ${mascot("Trazo","✏️")}
   <div><h2>${escapeHTML(data.profile)}</h2><p class="muted">Aprendiz de DRAWO</p></div>
  </div>
 </section>
 <section class="panel">
  <h2>Mis estadísticas</h2>
  <div class="grid">
   <div class="stage-card"><h2>⭐ ${data.xp}</h2><p class="muted">Experiencia</p></div>
   <div class="stage-card"><h2>🔥 ${data.streak}</h2><p class="muted">Racha de días</p></div>
   <div class="stage-card"><h2>${done}/7</h2><p class="muted">Lecciones terminadas</p></div>
  </div>
 </section>
 <section class="panel">
  <h2>Mis avances</h2>
  <p>Etapa 1: Primeros trazos</p>
  <div class="progress"><div style="width:${done/7*100}%"></div></div>
  <p class="muted small">El progreso se guarda únicamente en este navegador.</p>
 </section>`;
}
function renderSettings(){
 app.innerHTML=`
 <section class="panel">
  <h1>Configuración</h1>
  <div class="setting-row"><div><b>Perfil</b><div class="muted small">${escapeHTML(data.profile)}</div></div><span>👤</span></div>
  <div class="setting-row"><div><b>Reiniciar progreso</b><div class="muted small">Vuelve a comenzar las lecciones desde cero. Conserva tu perfil.</div></div><button class="btn secondary" id="resetProgress">Reiniciar</button></div>
  <div class="setting-row"><div><b>Cerrar sesión</b><div class="muted small">Sal de tu perfil en este navegador.</div></div><button class="btn secondary" id="logout">Cerrar sesión</button></div>
  <div class="setting-row"><div><b>Eliminar cuenta</b><div class="muted small">Elimina tu perfil local y todos sus datos de DRAWO en este navegador.</div></div><button class="btn danger" id="deleteAccount">Eliminar</button></div>
  <hr>
  <p class="muted small">DRAWO Beta 3.0 · Versión local de prueba. No hay sincronización en la nube.</p>
 </section>`;
 document.getElementById("resetProgress").onclick=()=>{
  if(!confirm("¿Seguro que quieres reiniciar todas tus lecciones y tu experiencia? Tu nombre de perfil se conservará."))return;
  data.xp=0;data.completed=[];data.lessonProgress={};data.streak=0;data.lastDay="";
  save();alert("Tu progreso se ha reiniciado.");showPage("profile");
 };
 document.getElementById("logout").onclick=()=>{
  if(!confirm("¿Quieres cerrar sesión? Tu progreso se conservará en este navegador."))return;
  stopDemo();nav.classList.add("hidden");showWelcome();
 };
 document.getElementById("deleteAccount").onclick=()=>{
  if(!confirm("¿Eliminar tu perfil y todos los datos locales de DRAWO? Esta acción no se puede deshacer."))return;
  if(!confirm("Última confirmación: ¿quieres eliminar definitivamente este perfil de este navegador?"))return;
  localStorage.removeItem(KEY);
  data={version:3,profile:null,xp:0,streak:0,lastDay:"",completed:[],lessonProgress:{},accountExists:false};
  nav.classList.add("hidden");showWelcome();
 };
}
  function startLesson(i){
 if(i>0&&!data.completed.includes(i-1)&&!data.completed.includes(i)){
  alert("Primero tienes que completar la lección anterior.");return;
 }
 currentLesson=i;
 currentActivity=0;
 strokes=[];redoStack=[];uploadedImage=null;
 renderActivityIntro();
}
function renderActivityIntro(){
 stopDemo();
 const a=activities[currentLesson][currentActivity];
 const n=currentActivity+1;
 app.innerHTML=`
 <section class="panel">
  <span class="tag">Etapa 1 · Lección ${currentLesson+1} · Actividad ${n}/5</span>
  <div class="hero" style="margin-top:18px">
   <div class="mascot">✏️</div>
   <div>
    <h1>${escapeHTML(a[1])}</h1>
    <p>${escapeHTML(a[0])}</p>
   </div>
  </div>
  <div class="dialogue">
   <b>Trazo:</b> ${escapeHTML(a[2])}
  </div>
  <div class="btnrow">
   <button class="btn" id="startDrawing">Continuar →</button>
   <button class="btn secondary" id="backToRoute">Volver al recorrido</button>
  </div>
 </section>`;
 document.getElementById("startDrawing").onclick=renderActivity;
 document.getElementById("backToRoute").onclick=()=>showPage("route");
}
function renderActivity(){
 stopDemo();
 const a=activities[currentLesson][currentActivity];
 const n=currentActivity+1;
 const pct=(currentActivity/5)*100;
 lastCheck=null;
 app.innerHTML=`
 <section class="panel">
  <div class="activity-head">

 <section class="panel">
  <div class="activity-head"><h2>Tu lienzo</h2><span class="muted small">Dibuja aquí</span></div>

  const c=document.getElementById("color");
  if(c.value==="#ffffff"){c.value="#242638";document.getElementById("eraser").textContent="⌫ Borrador";}
  else{c.value="#ffffff";document.getElementById("eraser").textContent="✏️ Lápiz";}
 };
 document.getElementById("clear").onclick=()=>{
  if(confirm("¿Limpiar el lienzo?")){strokes=[];redoStack=[];uploadedImage=null;redraw()}
 };
 document.getElementById("undo").onclick=()=>{
  if(strokes.length){redoStack.push(strokes.pop());redraw()}
 };
 document.getElementById("redo").onclick=()=>{
  if(redoStack.length){strokes.push(redoStack.pop());redraw()}
 };
}
function activityExtra(type){
 const examples={
  lines:"<p>Observa: una línea puede ser corta, larga, fina o gruesa.</p>",
  directions:"<p><b>Horizontal:</b> — &nbsp; <b>Vertical:</b> | &nbsp; <b>Diagonal:</b> /</p>",
  curves:"<p>Ejemplos: una onda, un arco y una espiral.</p>",
  opacity:"<p>Prueba a cambiar el control de opacidad antes de dibujar cada línea.</p>",
  points:"<p>Imagina varios puntos repartidos por el lienzo. Intenta conectarlos con cuidado.</p>",
  combine:"<p>Una figura puede mezclar segmentos rectos y curvas.</p>",
  review:"<p>Recuerda: trazos rectos, curvas, formas geométricas y control de intensidad.</p>",
  finalWork:"<p>Esta es tu evaluación práctica final. No tienes que copiar un ejemplo: queremos ver cómo aplicas lo aprendido.</p>"
 };
 return examples[type]||"";
}
function initCanvas(){
 canvas=document.getElementById("drawingCanvas");
 ctx=canvas.getContext("2d");
 redraw();
 const getPos=e=>{
  const r=canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*canvas.width,y:(e.clientY-r.top)/r.height*canvas.height};
 };
 canvas.onpointerdown=e=>{
  stopDemo();drawing=true;canvas.setPointerCapture(e.pointerId);
  const p=getPos(e);
  currentStroke={points:[p],color:document.getElementById("color").value,
   size:Number(document.getElementById("size").value),
   opacity:Number(document.getElementById("opacity").value)/100};
  redoStack=[];strokes.push(currentStroke);redraw();
 };
 canvas.onpointermove=e=>{
  if(!drawing||!currentStroke)return;
  currentStroke.points.push(getPos(e));redraw();
 };
 const end=()=>{drawing=false;currentStroke=null};
 canvas.onpointerup=end;canvas.onpointercancel=end;
 document.getElementById("size").oninput=e=>document.getElementById("sizeValue").textContent=e.target.value;
 document.getElementById("opacity").oninput=e=>document.getElementById("opacityValue").textContent=e.target.value+"%";
}
function redraw(){
 if(!canvas||!ctx)return;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle="#ffffff";ctx.fillRect(0,0,canvas.width,canvas.height);
 if(uploadedImage){
  try{ctx.drawImage(uploadedImage,0,0,canvas.width,canvas.height)}catch(e){}
 }
 for(const s of strokes)drawStroke(s);
}
function drawStroke(s){
 if(!s.points||!s.points.length)return;
 ctx.save();ctx.globalAlpha=s.opacity??1;ctx.strokeStyle=s.color||"#222";
 ctx.fillStyle=s.color||"#222";ctx.lineWidth=s.size||5;ctx.lineCap="round";ctx.lineJoin="round";
 if(s.points.length===1){
  ctx.beginPath();ctx.arc(s.points[0].x,s.points[0].y,(s.size||5)/2,0,Math.PI*2);ctx.fill();
 }else{
  ctx.beginPath();ctx.moveTo(s.points[0].x,s.points[0].y);
  for(let i=1;i<s.points.length;i++)ctx.lineTo(s.points[i].x,s.points[i].y);
  ctx.stroke();
 }
 ctx.restore();
}
document.getElementById("imageUpload").addEventListener("change",e=>{
 const file=e.target.files[0];if(!file)return;
 if(!file.type.startsWith("image/")){alert("Selecciona un archivo de imagen.");return}
 const reader=new FileReader();
 reader.onload=()=>{
  const img=new Image();
  img.onload=()=>{uploadedImage=img;redraw();alert("Dibujo cargado en el lienzo. Puedes usarlo como referencia o entregarlo en esta actividad.")};
  img.src=reader.result;
 };
 reader.readAsDataURL(file);e.target.value="";
});

function stopDemo(){
 if(demoTimer){clearInterval(demoTimer);demoTimer=null}
 demoPlaying=false;
}
function playDemo(){
 stopDemo();
 const type=activities[currentLesson][currentActivity][3];
 const demo=demos[type];
 if(!demo){
  const f=document.getElementById("feedback");
  f.innerHTML='<div class="check-result">Esta actividad no tiene una animación guiada específica todavía. ¡Puedes practicar libremente!</div>';
  return;
 }
 strokes=[];redoStack=[];uploadedImage=null;redraw();
 demoPlaying=true;
 let index=0;
 const drawNext=()=>{
  if(index>=demo.length){
   stopDemo();
   setTimeout(()=>{strokes=[];redraw()},850);
   return;
  }
  const d=demo[index];
  const s={points:[],color:"#7057df",size:7,opacity:1};
  strokes.push(s);
  const x1=d[1]*canvas.width,y1=d[2]*canvas.height;
  const x2=d[d[0]==="curve"?7:3]*canvas.width;
  const y2=d[d[0]==="curve"?8:4]*canvas.height;
  const steps=35;
  let k=0;
  const timer=setInterval(()=>{
   k++;
   const t=k/steps;
   let x,y;
   if(d[0]==="curve"){
    const c1x=d[3]*canvas.width,c1y=d[4]*canvas.height;
    const c2x=d[5]*canvas.width,c2y=d[6]*canvas.height;
    const mt=1-t;
    x=mt*mt*mt*x1+3*mt*mt*t*c1x+3*mt*t*t*c2x+t*t*t*x2;
    y=mt*mt*mt*y1+3*mt*mt*t*c1y+3*mt*t*t*c2y+t*t*t*y2;
   }else{x=x1+(x2-x1)*t;y=y1+(y2-y1)*t}
   s.points.push({x,y});redraw();
   if(k>=steps){
    clearInterval(timer);
    setTimeout(()=>{
     strokes.pop();redraw();index++;setTimeout(drawNext,250);
    },350);
   }
  },18);
 };
 drawNext();
}
  function getMetrics(){
 const all=strokes.filter(s=>s.points&&s.points.length);
 const lineStats=all.map(s=>{
  const p=s.points;
  const first=p[0],last=p[p.length-1];
  const dx=last.x-first.x,dy=last.y-first.y;
  const length=Math.hypot(dx,dy);
  let path=0;
  for(let i=1;i<p.length;i++)path+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);
  const direct=length||1;
  return {dx,dy,length,path,ratio:path/direct,points:p.length,opacity:s.opacity??1};
 });
 const total=all.length;
 const horizontal=lineStats.filter(s=>Math.abs(s.dy)<Math.abs(s.dx)*.35).length;
 const vertical=lineStats.filter(s=>Math.abs(s.dx)<Math.abs(s.dy)*.35).length;
 const diagonal=lineStats.filter(s=>Math.abs(s.dx)>20&&Math.abs(s.dy)>20&&Math.abs(Math.abs(s.dx)-Math.abs(s.dy))<Math.max(Math.abs(s.dx),Math.abs(s.dy))*.8).length;
 const curved=lineStats.filter(s=>s.ratio>1.18&&s.points>5).length;
 const opacities=lineStats.map(s=>s.opacity);
 return {total,horizontal,vertical,diagonal,curved,opacities,lineStats};
}
function checkActivity(){
 stopDemo();
 const type=activities[currentLesson][currentActivity][3];
 const m=getMetrics();
 let pass=false,msg="";
 const requireStrokes=(n)=>m.total>=n;
 switch(type){
  case "five":case "fiveCurves":pass=requireStrokes(5);msg="Intenta realizar al menos cinco trazos.";break;
  case "shapes":pass=requireStrokes(3);msg="Prueba a dibujar varias formas diferentes.";break;
  case "variety":case "allDirections":
   pass=m.total>=3&&(m.horizontal>0||type==="variety")&&(m.curved>0||type==="variety")&&(m.vertical>0||m.diagonal>0||type==="variety");
   msg="Necesitas combinar distintos tipos de trazos y direcciones.";break;
  case "horizontal":pass=m.horizontal>=2;msg="Intenta dibujar al menos tres líneas horizontales.";break;
  case "parallel":pass=m.total>=6&&(m.horizontal+m.diagonal)>=4;msg="Dibuja varias líneas con direcciones parecidas y algunas diagonales.";break;
  case "house":pass=m.total>=6;msg="Construye la casa con varios trazos: paredes, techo y detalles.";break;
  case "curveTypes":pass=m.curved>=3&&m.total>=5;msg="Prueba a crear varias curvas, ondas o espirales.";break;
  case "ocean":case "curveVariety":pass=m.curved>=3;msg="Incluye más líneas curvas en tu composición.";break;
  case "intensity":case "fiveLevels":pass=m.total>=3&&new Set(opacities.map(v=>Math.round(v*10))).size>=2;msg="Cambia la opacidad entre tus trazos para crear intensidades distintas.";break;
  case "sphere":case "shading":pass=m.total>=5&&new Set(opacities.map(v=>Math.round(v*10))).size>=2;msg="Prueba con más trazos y diferentes niveles de opacidad.";break;
  case "circles":pass=m.total>=3;msg="Intenta dibujar tres círculos o formas redondeadas.";break;
  case "path":case "route":pass=m.total>=1&&m.lineStats.some(s=>s.path>180);msg="Intenta realizar un recorrido más largo y continuo.";break;
  case "threeCombined":case "objects":case "rocket":pass=m.total>=5;msg="Combina más trazos para construir tus formas u objetos.";break;
  case "warmup":pass=m.total>=4;msg="Realiza los cuatro trazos del calentamiento.";break;
  case "finalCreate":case "finalWork":case "freeTest":case "freeCombined":case "creative":case "guided":
   pass=m.total>=5;msg="Tu dibujo necesita más trazos para mostrar lo que has practicado.";break;
  default:pass=m.total>=2;msg="Prueba a añadir algunos trazos más.";
 }
 const feedback=document.getElementById("feedback");
 if(pass){
  feedback.innerHTML=`<div class="check-result good"><b>¡Muy bien!</b><br>Has cumplido el objetivo básico de esta actividad. Puedes continuar.</div><div class="btnrow"><button class="btn green" id="nextActivity">Continuar →</button></div>`;
  document.getElementById("nextActivity").onclick=nextActivity;
 }else{
  feedback.innerHTML=`<div class="check-result bad"><b>¡Casi lo tienes!</b><br>${msg}<br><span class="small muted">No necesitas un dibujo perfecto. Inténtalo otra vez.</span></div>`;
 }
}
function nextActivity(){
 if(currentActivity<4){
  currentActivity++;strokes=[];redoStack=[];uploadedImage=null;renderActivityIntro();
 }else{
  if(!data.completed.includes(currentLesson)){
   data.completed.push(currentLesson);data.xp+=50;updateStreak();save();
  }
  renderLessonComplete();
 }
}

 app.innerHTML=`

  <div class="btnrow" style="justify-content:center">
